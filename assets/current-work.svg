<text x="434" y="48" fill="#AA91FF" font-family="monospace" font-size="15" letter-spacing="1.2" font-weight="700">02 / INTERACTIVE GAMES</text><text x="434" y="99" fill="#F5F7FF" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">POLARIZED GAMES</text><text x="434" y="139" fill="#BFC8E6" font-family="Arial,Helvetica,sans-serif" font-size="19">Reusable mechanics and</text><text x="434" y="167" fill="#BFC8E6" font-family="Arial,Helvetica,sans-serif" font-size="19">playable campaign experiences</text><path d="M434 195h57" stroke="#AA91FF" stroke-width="4" stroke-linecap="round"/>
