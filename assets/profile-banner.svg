<path d="M0 350H1500" stroke="#30373f"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="68" y="76" fill="#a0aaa9" font-size="17" letter-spacing="4">ALEXIS ROQUES / CREATIVE DEVELOPMENT</text>
<text x="64" y="176" fill="#f0eee6" font-size="76" font-weight="700" letter-spacing="-3">Made to work.</text>
<text x="64" y="262" fill="#b8e693" font-size="76" font-weight="700" letter-spacing="-3">Built to play.</text>
<text x="68" y="390" fill="#a0aaa9" font-size="17" letter-spacing="2">WEB DEVELOPMENT + UI ENGINEERING + INDIE GAMES</text>
<text x="1430" y="390" fill="#b8e693" font-size="17" text-anchor="end">AlexisRqs</text>
</g>
